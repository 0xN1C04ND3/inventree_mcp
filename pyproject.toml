[project]
name = "inventree-mcp"
version = "1.0.0"
description = "MCP server for InvenTree inventory management — 12 tools, 117 operations"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "inventree>=0.22.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
inventree-mcp = "inventree_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventree_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
